name: My GitHub Actions

on:
  push:
  workflow_dispatch:

jobs:

  Job1:
    runs-on: ubuntu-latest

    steps:
      - name: Print Hello
        run: echo "Hello"

      - name: Print Ubuntu version
        run: lsb_release -a

      - name: Print commit SHA
        run: 'echo "Commit SHA: ${{ github.sha }}"'


  Job2:
    runs-on: ubuntu-latest
    needs: Job1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print all files
        run: |
          echo "===== Files in repository ====="
          ls -la

          echo "===== 1.txt ====="
          cat 1.txt

          echo "===== 2.txt ====="
          cat 2.txt

      - name: Run test.sh
        run: |
          chmod +x ./test.sh
          ./test.sh


  Job3:
    runs-on: ubuntu-latest
    needs: Job2

    env:
      FIRST_NAME: "Hazem"

    steps:
      - name: Print First Name
        run: 'echo "First Name: $FIRST_NAME"'

      - name: Print Last Name
        run: |
          LAST_NAME="Khateb"
          echo "Last Name: $LAST_NAME"

      - name: Print Phone Number
        run: 'echo "Phone Number: ${{ secrets.PHONE }}"'
